# =====================================================
# SERVIDOR
# =====================================================

server.port=8080



# =====================================================
# SQLITE DATABASE
# =====================================================

spring.datasource.url=jdbc:sqlite:maelespecieros.db

spring.datasource.driver-class-name=org.sqlite.JDBC



# =====================================================
# JPA
# =====================================================

spring.jpa.hibernate.ddl-auto=none

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true



# =====================================================
# FLYWAY
# =====================================================

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration



# =====================================================
# TIMEZONE
# =====================================================

spring.jackson.time-zone=America/Argentina/Buenos_Aires

spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires



# =====================================================
# JWT SECURITY
# =====================================================

jwt.secret=${JWT_SECRET:MaelEspecierosJWTSecretProduccion2026Seguro}

jwt.expiration=28800000

# =====================================================
# ARTIFICIAL INTELLIGENCE (GEMINI)
# =====================================================

gemini.api.key=${GEMINI_API_KEY:su_clave_api_gemini_aqui}

# =====================================================
# CORS SECURITY
# =====================================================

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}



# =====================================================
# BLOCKCHAIN SECURITY
# =====================================================

blockchain.hmac.secret=${BLOCKCHAIN_SECRET:MaelBlockchainSecretProduccion2026}



# =====================================================
# LOGGING
# =====================================================

logging.level.org.springframework.security=INFO

logging.level.com.maelespecieros.backend=DEBUG